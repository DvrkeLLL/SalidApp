<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalidApp</title>
<meta name="application-name" content="SalidApp">
<meta name="apple-mobile-web-app-title" content="SalidApp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="SalidApp: mira en cuántos minutos pasa tu micro en tus paraderos favoritos.">
<link rel="icon" type="image/png" href="Icono_SalidApp.PNG">
<link rel="apple-touch-icon" href="Icono_SalidApp.PNG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f6f7;--card:#fff;--ink:#17181c;--mut:#767a84;--line:#ececf0;--accent:#e4002b;--go:#1d9a68;--r:16px;--navh:68px;--toph:55px;--font:'Sora',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.view{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + var(--toph));bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));overflow:auto;display:none}
.view.on{display:block}
.view{overscroll-behavior:contain}
#v-map{overflow:hidden}
.wrap{max-width:640px;margin:0 auto;padding:8px 20px 24px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.hd small{color:var(--mut);font-size:13.5px}
.hd h1{margin:4px 0 0;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tx{color:var(--accent);font-weight:600;font-size:15px;padding:6px 2px}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px}
.sh1{box-shadow:0 1px 2px rgba(20,20,30,.06),0 6px 18px rgba(20,20,30,.05)}

/* encabezado */
.top{position:fixed;left:0;right:0;top:0;z-index:900;height:calc(env(safe-area-inset-top,0px) + var(--toph));padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 12px;background:var(--bg)}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:23px;font-weight:700;margin:0;display:flex;align-items:center}
.title-app{line-height:1}
.title-sep{display:inline-block;width:2px;height:18px;background:var(--ink);margin:0 0 0 8px;flex-shrink:0}
.title-wrap{box-sizing:border-box;display:inline-block;overflow:hidden;width:44px;padding-left:8px;height:1em;line-height:1}
.title-section{display:inline-block;white-space:nowrap;color:var(--accent);line-height:1}

#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--toph));width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.14);display:grid;place-items:center;color:var(--accent);z-index:850;opacity:0;transform:translateY(-48px);pointer-events:none}
#ptr.anim{transition:transform .25s ease,opacity .25s ease}
#ptr svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ptr.busy svg{animation:spin .8s linear infinite}
.note{border:1px solid #f3c7cd;background:#fff6f7;color:#8a1c2b;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}

/* grupos */
.grp,.fav,.empty-card{background:var(--card);border-radius:var(--r);margin-bottom:14px;box-shadow:0 1px 2px rgba(20,20,30,.06),0 6px 18px rgba(20,20,30,.05)}
.grp{position:relative;overflow:hidden;padding:16px 18px 8px}
.grp header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.hr{display:flex;align-items:flex-start;gap:10px;flex:none}
.rc{display:flex;flex-direction:column;align-items:center;gap:3px}
.ut{font-size:11px;line-height:1;color:var(--mut);font-variant-numeric:tabular-nums}
.grp h2{margin:0;padding-top:6px;font-size:15.5px;font-weight:600;line-height:1.25}
.grp .d{color:var(--mut);font-size:12.5px;white-space:nowrap;padding-top:7px;line-height:1.25}
.grp .d b{color:var(--accent);font-weight:600}
.grp.ed{outline:2px dashed var(--line);cursor:pointer}
.rf{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mut);border:1px solid var(--line);background:var(--card)}
.rf svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rf:active{background:var(--bg)}
.rf.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent);transform-origin:left;transform:scaleX(0);animation:fillbar 60s linear forwards}
@keyframes fillbar{to{transform:scaleX(1)}}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 0}
.row+.row{border-top:1px solid var(--line)}
.who{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.svc{display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:54px;padding:0 10px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:17px}
.at{color:var(--mut);font-size:12px;line-height:1.2;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eta{flex:none;height:32px;font-weight:300;font-size:24px;line-height:32px;letter-spacing:-.02em;white-space:nowrap;text-align:right}
.eta small{font-size:13px;font-weight:400;color:var(--mut);margin-right:5px;letter-spacing:0}
.eta.go{color:var(--accent);font-weight:600}
.eta.none{color:var(--mut);font-size:15px;font-weight:400;letter-spacing:0}
.newg{width:100%;padding:14px;border:1.5px dashed #c9ccd3;border-radius:var(--r);color:var(--mut);font-weight:600;font-size:15px}
.empty-card{padding:28px 20px;text-align:center}
.empty-card h2{margin:0 0 6px;font-size:20px;font-weight:600}
.empty-card p{margin:0 0 16px;color:var(--mut);font-size:15px}
.empty{color:var(--mut);font-size:15px;padding:10px 0 20px}

/* favoritos */
.fav{padding:14px 16px}
.fav h2{margin:0;font-size:16px;font-weight:600;line-height:1.2}
.fav .cd{color:var(--mut);font-size:13px;margin:2px 0 10px}
.fav .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{border:1.5px solid var(--line);border-radius:8px;padding:2px 10px;font-weight:600;font-size:14px}
.fa{display:flex;gap:4px}
.fa button{color:var(--mut);font-size:13px;padding:4px 6px}

/* botones */
.btn{background:var(--accent);color:#fff;border-radius:var(--r);padding:12px 18px;font-weight:600;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--mut)}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}

/* mapa */
.mapbox{position:absolute;inset:0}
#map{position:absolute;inset:0}
.search{position:absolute;left:12px;right:12px;top:12px;z-index:600;display:flex;gap:8px;align-items:center;background:var(--card);border-radius:var(--r);padding:6px 6px 6px 14px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:616px;margin:0 auto}
.search svg{flex:none;color:var(--mut)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:8px 0;text-transform:uppercase}
.search input::placeholder{text-transform:none;color:var(--mut)}
.search button{background:var(--accent);color:#fff;border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px}
#hint{position:absolute;left:12px;right:12px;top:68px;z-index:500;background:var(--card);color:var(--mut);border-radius:12px;padding:8px 12px;font-size:13.5px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);pointer-events:none;max-width:616px;margin:0 auto}
.locate{position:absolute;left:12px;bottom:12px;z-index:500;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#msheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:1100;max-width:616px;margin:0 auto;background:var(--card);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.18);padding:16px;max-height:72%;overflow:auto;transform:translateY(125%);transition:transform .22s ease-out}
#msheet.open{transform:none}
h3{margin:0 0 2px;font-size:17px;font-weight:600;line-height:1.2}
.codeline{display:flex;gap:8px;margin:10px 0}
input.f,.codeline input,.manual input{min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px}
.codeline input{flex:1;text-transform:uppercase}
.msg{color:var(--mut);font-size:13px;margin:6px 0}
.msg.bad{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;font-weight:600;font-size:17px;min-width:56px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.dim{opacity:.55}
.manual{display:flex;gap:8px;margin-top:8px}
.manual input{width:120px;text-transform:uppercase}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1}
.leaflet-container{font-family:var(--font)}

/* hoja de grupo */
#scrim{position:fixed;left:0;right:0;top:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));background:rgba(20,20,30,.3);display:none;z-index:1150}
#scrim.on{display:block}
#sh{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px 16px}
.route{display:flex;align-items:stretch;gap:8px;margin-top:12px}
.slot{flex:1;min-width:0;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;background:var(--bg);transition:border-color .25s,background .25s}
.slot small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.slot b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.on.a{border-color:var(--go);background:#eaf7f1}.slot.on.a small{color:var(--go)}
.slot.on.b{border-color:var(--accent);background:#fdecef}.slot.on.b small{color:var(--accent)}
.arr{align-self:center;color:var(--mut)}
.slot.pop b{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.slot.ping.a{animation:pinga .55s ease-out}.slot.ping.b{animation:pingb .55s ease-out}
@keyframes pop{0%{transform:translateY(16px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes pinga{0%{box-shadow:0 0 0 0 rgba(29,154,104,.4)}100%{box-shadow:0 0 0 12px rgba(29,154,104,0)}}
@keyframes pingb{0%{box-shadow:0 0 0 0 rgba(228,0,43,.35)}100%{box-shadow:0 0 0 12px rgba(228,0,43,0)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pick{margin-top:14px}.pick.a{--c:var(--go)}.pick.b{--c:var(--accent)}
.ask{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--c)}
.own{display:flex;gap:8px;margin-bottom:12px}
.own input{flex:1;min-width:0}
.chip.cp{border-color:var(--c);color:var(--c);padding:5px 12px;font-size:14px;min-width:0}
.chip.cp.cur{background:var(--c);color:#fff}
.fade{animation:fadein .35s ease-out}
.fs{margin-top:12px}
.fn{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;margin-bottom:2px}
.fn span{color:var(--mut);font-weight:400;font-size:12.5px}
#sh .btn{width:100%;margin-top:14px}
#sh .btn.ghost,#sh .btn.danger{margin-top:6px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:1200;color:#a2a6af}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;position:relative}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=page]{color:var(--accent)}
.nav button[aria-current=page]::after{content:"";position:absolute;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){#msheet{transition:none}.slot,.slot b,.fade{animation:none!important}}
</style>
</head>
<body>

<header class="top"><div class="in"><h1><span class="title-app">SalidApp</span><span class="title-sep"></span><span class="title-wrap" id="titleWrap"><span class="title-section" id="titleSection">Inicio</span></span></h1><button class="tx" id="ed" hidden>Editar</button></div></header>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></svg></div>

<main class="view on" id="v-home"><div id="home"></div></main>
<section class="view" id="v-fav"><div id="favc"></div></section>
<section class="view" id="v-map">
  <div class="mapbox">
    <div id="map"></div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="qcode" placeholder="Buscar por código (ej. PA433)" autocomplete="off" aria-label="Código de paradero">
      <button id="qgo">Buscar</button>
    </div>
    <div id="hint">Acerca el mapa para ver los paraderos</div>
    <button class="icon-btn locate" id="locate">Mi ubicación</button>
    <div id="msheet" role="dialog" aria-live="polite"></div>
  </div>
</section>
<div id="scrim"><div id="sh" role="dialog"></div></div>

<nav class="nav" aria-label="Principal">
  <button data-t="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7.5 9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>Inicio</button>
  <button data-t="fav" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/></svg>Favoritos</button>
  <button data-t="map" aria-current="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
'use strict';
const KEY='paradero-v2', OLD='paradero-home-v1';
const API='https://api.xor.cl/red/bus-stop/';
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const PLACES=['Casa','Trabajo','Universidad','Colegio','Gimnasio','Metro','Centro','Familia'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(a,b)=>String(a).localeCompare(String(b),'es',{numeric:true});

/* ---------- datos guardados ---------- */
let D=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.favs))return{favs:s.favs,groups:s.groups||[],places:s.places||[],nid:s.nid||1}}catch(e){}
  const d={favs:[],groups:[],places:[],nid:1};
  try{const o=JSON.parse(localStorage.getItem(OLD));
    if(o&&Array.isArray(o.stops))d.favs=o.stops.map(s=>({code:s.code,name:s.name||'',lat:s.lat??null,lng:s.lng??null,services:(s.services||[]).map(String)}))}catch(e){}
  return d;
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
const fav=c=>D.favs.find(f=>f.code===c);
const allPlaces=()=>[...PLACES,...D.places];
function cleanGroups(){
  D.groups.forEach(g=>g.items=g.items.filter(([c,s])=>{const f=fav(c);return f&&f.services.includes(s)}));
  D.groups=D.groups.filter(g=>g.items.length);
}

/* ---------- estado ---------- */
const S={tab:'home',edit:false,here:null,gs:null,ms:null,flash:'',loc:'',pull:false};
const POSKEY='paradero-pos';
try{const q=JSON.parse(localStorage.getItem(POSKEY));if(q&&Date.now()-q.t<3*3600e3)S.here={lat:q.lat,lng:q.lng}}catch(e){}
const arrivals={}; let lastUpdate=null;
const GT={},GB={};let lastLoc=0;

/* ---------- API ---------- */
async function fetchStop(code){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);
  try{const r=await fetch(API+encodeURIComponent(code),{signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  finally{clearTimeout(t)}
}

/* ---------- distancia ---------- */
function dist(code){
  const f=fav(code); if(!S.here||!f||f.lat==null||f.lng==null) return null;
  const R=6371000,rad=x=>x*Math.PI/180,dl=rad(f.lat-S.here.lat),dg=rad(f.lng-S.here.lng);
  const a=Math.sin(dl/2)**2+Math.cos(rad(S.here.lat))*Math.cos(rad(f.lat))*Math.sin(dg/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(a)));
}
const fmt=m=>m<1000?`${m} m`:`${(m/1000).toFixed(1).replace('.',',')} km`;
function gDist(g){
  const ds=[...new Set(g.items.map(i=>i[0]))].map(dist).filter(x=>x!=null);
  return ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:null;
}
function locate(){
  return new Promise(res=>{
    if(!navigator.geolocation){S.loc='na';rerender();return res(false)}
    navigator.geolocation.getCurrentPosition(p=>{
      S.here={lat:p.coords.latitude,lng:p.coords.longitude};S.loc='ok';
      try{localStorage.setItem(POSKEY,JSON.stringify({lat:S.here.lat,lng:S.here.lng,t:Date.now()}))}catch(e){}
      rerender();res(true);
    },err=>{S.loc=err&&err.code===1?'denied':'error';rerender();res(false)},{timeout:15000,maximumAge:60000});
  });
}
function rerender(){if(S.tab==='home')renderHome();else if(S.tab==='fav')renderFav()}

/* ---------- tiempos ---------- */
function etaOf(c,s){
  const d=arrivals[c]?.data, sv=d?.services?.find(x=>String(x.id).toUpperCase()===s), b=sv?.buses?.[0];
  if(b){
    const mn=b.min_arrival_time,mx=b.max_arrival_time;
    if(mn!=null||mx!=null){
      const lo=mn??mx,hi=mx??mn;
      if(hi<=1) return{lo:0,h:'<div class="eta go">Llegando</div>'};
      return{lo,h:`<div class="eta"><small>en</small>${lo===hi?lo:lo+'–'+hi} min</div>`};
    }
  }
  return{lo:1e9,h:`<div class="eta none">${!arrivals[c]?'…':(d?'Sin micros':'—')}</div>`};
}

/* ---------- Inicio ---------- */
const hhmm=t=>{if(!t)return'--:--';const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function ordG(){return D.groups.map((g,i)=>({g,i,d:gDist(g)})).sort((a,b)=>(a.d??Infinity)-(b.d??Infinity)||a.i-b.i)}

function renderHome(){
  let h='<div class="wrap">';
  if(!D.favs.length){
    h+=`<div class="empty-card"><h2>Aún no tienes paraderos</h2><p>Toca un paradero en el mapa y guárdalo en favoritos. Después arma aquí tus grupos de micros.</p><button class="btn" data-go="map">Ir al mapa</button></div>`;
  }else{
    const gs=ordG();
    const note=!S.here?(S.loc==='denied'?'Sin permiso de ubicación: no puedo poner primero lo más cercano. Actívalo en los ajustes del navegador y desliza hacia abajo para reintentar.':(S.loc==='error'||S.loc==='na')?'No pude obtener tu ubicación todavía. Desliza hacia abajo para reintentar.':''):'';
    if(note&&gs.length) h+=`<p class="note">${note}</p>`;
    if(!gs.length) h+='<p class="empty">Crea tu primer grupo con micros de tus paraderos favoritos.</p>';
    h+=gs.map(({g,d},i)=>{
      const rows=g.items.map(([c,s])=>({c,s,e:etaOf(c,s)})).sort((a,b)=>a.e.lo-b.e.lo);
      const dl=d==null?'':(i===0&&gs.length>1?'<b>Más cercano</b> · ':'')+'a '+fmt(Math.round(d));
      return `<article class="grp${S.edit?' ed':''}" data-g="${g.id}"><header><h2>${esc(g.title)}</h2><div class="hr"><span class="d">${S.edit?'Editar ›':dl}</span>${S.edit?'':`<div class="rc"><button class="rf${GB[g.id]?' spin':''}" data-rf="${g.id}" aria-label="Actualizar ${esc(g.title)}"${GB[g.id]?' disabled':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button><span class="ut">${hhmm(GT[g.id])}</span></div>`}</div></header>
        ${rows.map(r=>`<div class="row"><div class="who"><span class="svc">${esc(r.s)}</span><span class="at">${esc(fav(r.c)?.name||r.c)}</span></div>${r.e.h}</div>`).join('')}${i===0?`<div class="bar" style="animation-delay:-${GT[g.id]?Math.min(60,(Date.now()-GT[g.id])/1000).toFixed(2):0}s"></div>`:''}</article>`;
    }).join('');
    h+='<button class="newg" id="ng">+ Nuevo grupo</button>';
  }
  $('#home').innerHTML=h+'</div>';
  const eb=$('#ed'); eb.hidden=!D.groups.length; eb.textContent=S.edit?'Listo':'Editar';
}

  await Promise.all(codes.map(async c=>{
    try{
      const data=await fetchStop(c); arrivals[c]={data};
      const f=fav(c); if(f&&data.name&&f.name!==data.name){f.name=data.name;save()}
    }catch(e){arrivals[c]={...(arrivals[c]||{}),err:true}}
  }));
  GB[id]=false; GT[id]=Date.now(); lastUpdate=new Date();
  if(S.tab==='home') renderHome();
}

let map=null,layer=null,mapInit=false,markers=new Map(),selMarker=null,loadTimer=null;
const ST={fav:{fillColor:'#e4002b',color:'#fff',weight:3,fillOpacity:1,radius:10},
  stop:{fillColor:'#8a8f99',color:'#fff',weight:3,fillOpacity:1,radius:9},
  none:{fillColor:'#c4c7ce',color:'#fff',weight:2,fillOpacity:.95,radius:7},
  sel:{fillColor:'#17181c',color:'#fff',weight:3,fillOpacity:1,radius:12}};
const baseStyle=m=>m.code?(fav(m.code)?ST.fav:ST.stop):ST.none;
const restyle=()=>markers.forEach(m=>{if(m!==selMarker)m.setStyle(baseStyle(m.meta))});

function initMap(){
  if(map) return;
  map=L.map('map',{zoomControl:false}).setView([-33.4489,-70.6693],15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on('moveend',()=>{clearTimeout(loadTimer);loadTimer=setTimeout(loadStops,350)});
}
function locateMap(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p=>{S.here={lat:p.coords.latitude,lng:p.coords.longitude};map.setView([S.here.lat,S.here.lng],17)},()=>{},{timeout:8000});
}

function extractCode(tags){
  const re=/\bP[A-Z]\d{1,5}\b/i;
  for(const k of ['ref','ref:red','ref:transantiago','ref:cl','official_ref','local_ref','name']){const m=tags[k]&&String(tags[k]).match(re);if(m)return m[0].toUpperCase()}
  for(const v of Object.values(tags)){const m=String(v).match(re);if(m)return m[0].toUpperCase()}
  return null;
}
async function loadStops(){
  const hint=$('#hint');
  if(map.getZoom()<16){hint.style.display='block';hint.textContent='Acerca el mapa para ver los paraderos';return}
  const b=map.getBounds();
  const q=`[out:json][timeout:25];node["highway"="bus_stop"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out body 500;`;
  hint.style.display='block';hint.textContent='Buscando paraderos…';
  let json=null;
  for(const url of OVERPASS){
    try{const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});if(r.ok){json=await r.json();break}}catch(e){}
  }
  if(!json){hint.textContent='No se pudieron cargar los paraderos. Usa el buscador por código.';return}
  json.elements.forEach(el=>{
    if(markers.has(el.id)) return;
    const code=extractCode(el.tags||{});
    const m=L.circleMarker([el.lat,el.lon],code?(fav(code)?ST.fav:ST.stop):ST.none).addTo(layer);
    m.meta={code,name:el.tags?.name||'',lat:el.lat,lng:el.lon};
    m.on('click',()=>{
      if(selMarker) selMarker.setStyle(baseStyle(selMarker.meta));
      selMarker=m;m.setStyle(ST.sel);m.bringToFront();
      openMS(fav(m.meta.code)||{code:m.meta.code||'',name:m.meta.name,lat:m.meta.lat,lng:m.meta.lng,services:[]});
    });
    markers.set(el.id,m);
  });
  hint.style.display='none';
}

function openMS(st){
  S.ms={code:st.code||'',name:st.name||'',lat:st.lat??null,lng:st.lng??null,set:new Set((st.services||[]).map(String)),available:[],status:'idle'};

  if(S.ms.code) lookup();
}
function closeMS(){S.ms=null;if(selMarker){selMarker.setStyle(baseStyle(selMarker.meta));selMarker=null}renderMS()}
async function lookup(){
  const m=S.ms,code=m.code.trim().toUpperCase(); if(!code) return;
  m.code=code;m.status='loading';renderMS();
  try{
    const d=await fetchStop(code); if(S.ms!==m||m.code!==code) return;
    if(d.name) m.name=d.name;
    m.available=(d.services||[]).map(s=>({id:String(s.id).toUpperCase(),valid:s.valid!==false}));
    m.status=m.available.length?'ok':'empty';
  }catch(e){if(S.ms===m&&m.code===code)m.status='error'}
  if(S.ms===m) renderMS();
}
function renderMS(){
  const m=S.ms,el=$('#msheet');
  if(!m){el.classList.remove('open');return}
  const ids=[...new Set([...m.available.map(s=>s.id),...m.set])].sort(num);
  const dim=id=>{const s=m.available.find(x=>x.id===id);return s&&!s.valid};
  const isF=!!fav(m.code);
  let msg='';
  if(!m.code) msg='<p class="msg">Este paradero no tiene código en el mapa. Escríbelo abajo: está en el letrero del paradero.</p>';
  else if(m.status==='loading') msg='<p class="msg">Buscando micros…</p>';
  else if(m.status==='error') msg='<p class="msg bad">No pude consultar ese código. Revisa que esté bien escrito y tu conexión.</p>';
  else if(m.status==='empty') msg='<p class="msg">No hay micros informadas ahora (puede ser de noche). Puedes agregarlas a mano.</p>';
  else if(m.status==='ok') msg='<p class="msg">Toca las micros que quieres guardar.</p>';
  el.innerHTML=`<h3>${esc(m.name||'Paradero')}</h3>
    <div class="codeline"><input id="mcode" value="${esc(m.code)}" placeholder="Código (ej. PA433)" autocomplete="off" aria-label="Código del paradero"><button class="icon-btn" id="mgo">Buscar micros</button></div>
    ${msg}<div class="chips">${ids.map(id=>`<button class="chip ${dim(id)?'dim':''}" data-id="${esc(id)}" aria-pressed="${m.set.has(id)}">${esc(id)}</button>`).join('')}</div>
    ${m.code?'<div class="manual"><input id="mman" placeholder="Otra micro" aria-label="Agregar micro a mano"><button class="icon-btn" id="madd">Agregar</button></div>':''}
    <div class="actions"><button class="btn" id="msave" ${m.set.size&&m.code?'':'disabled'}>${isF?'Actualizar favorito':'Guardar en favoritos'}</button>
    ${isF?'<button class="btn danger" id="mdel">Quitar</button>':'<button class="btn ghost" id="mcancel">Cancelar</button>'}</div>
    ${S.flash?`<p class="msg">${esc(S.flash)}</p>`:''}`;
  el.classList.add('open');
}

/* ---------- ubicación de los paraderos guardados (en segundo plano) ---------- */
const GBBOX='-33.85,-71.00,-33.20,-70.35';
let geoBusy=false;
async function findCoords(codes){
  const re=`(^|[^A-Za-z0-9])(${codes.join('|')})($|[^A-Za-z0-9])`;
  const q=`[out:json][timeout:25];node["highway"="bus_stop"][~"."~"${re}"](${GBBOX});out body 200;`;
  let json=null;
  for(const url of OVERPASS){
    try{const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});if(r.ok){json=await r.json();break}}catch(e){}
  }
  if(!json) throw new Error('overpass');
  const out=new Map();
  for(const el of json.elements||[]){
    for(const v of Object.values(el.tags||{})){
      for(const m of String(v).toUpperCase().matchAll(/\bP[A-Z]\d{1,5}\b/g)){
        if(codes.includes(m[0])&&!out.has(m[0])) out.set(m[0],[el.lat,el.lon]);
      }
    }
  }
  return out;
}
async function fillCoords(){
  if(geoBusy) return;
  const now=Date.now();
  const need=D.favs.filter(f=>(f.lat==null||f.lng==null)&&/^P[A-Z]\d{1,5}$/i.test(f.code)&&(!f.geoT||now-f.geoT>6*3600e3));
  if(!need.length) return;
  geoBusy=true;
  try{
    const found=await findCoords(need.map(f=>f.code.toUpperCase()));
    need.forEach(f=>{const c=found.get(f.code.toUpperCase());if(c){f.lat=c[0];f.lng=c[1];delete f.geoT}else f.geoT=now});
    save();rerender();
  }catch(e){}
  finally{geoBusy=false}
}

/* ---------- deslizar hacia abajo para actualizar todo ---------- */
async function pullRefresh(){
  S.pull=true;
  try{await locate();fillCoords();await Promise.all(D.groups.map(g=>refreshGroup(g.id)))}finally{S.pull=false}
  renderHome();
}
(function(){
  const v=$('#v-home'),ptr=$('#ptr'),ic=ptr.firstElementChild;
  let y0=null,dy=0,active=false;
  const reset=()=>{ptr.classList.add('anim');ptr.classList.remove('busy');ptr.style.transform='';ptr.style.opacity='';ic.style.transform='';setTimeout(()=>ptr.classList.remove('anim'),300)};
  v.addEventListener('touchstart',e=>{
    if(S.tab!=='home'||S.pull||v.scrollTop>0||e.touches.length!==1){y0=null;return}
    y0=e.touches[0].clientY;dy=0;active=false;
  },{passive:true});
  v.addEventListener('touchmove',e=>{
    if(y0===null) return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0||v.scrollTop>0){if(active){active=false;reset()}return}
    active=true; if(e.cancelable)e.preventDefault();
    const p=Math.min(dy*.5,90);
    ptr.classList.remove('anim');
    ptr.style.transform=`translateY(${p-48}px)`;ptr.style.opacity=Math.min(1,p/50);
    ic.style.transform=`rotate(${p*4}deg)`;
  },{passive:false});
  v.addEventListener('touchend',async()=>{
    if(y0===null||!active){y0=null;return}
    const p=Math.min(dy*.5,90);y0=null;active=false;
    if(p>=55){
      ptr.classList.add('anim','busy');ic.style.transform='';ptr.style.transform='translateY(10px)';ptr.style.opacity='1';
      await pullRefresh();
    }
    reset();
  });
  v.addEventListener('touchcancel',()=>{y0=null;if(active){active=false;reset()}});
})();

/* ---------- arranque ---------- */
renderHome();
refreshAll();
fillCoords();
})();
</script>
</body>
</html>
